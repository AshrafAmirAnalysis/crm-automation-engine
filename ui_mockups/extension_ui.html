<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D365 Automation Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* MacOS inspired styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .macos-btn {
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            border: 1px solid #d1d1d1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .macos-btn-primary {
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            border: 1px solid #00a8ff;
            color: white;
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen m-0">

    <!-- Extension Popup Container -->
    <div class="glass-panel w-80 rounded-2xl overflow-hidden relative">
        
        <!-- MacOS Style Header -->
        <div class="bg-gray-100/50 border-b border-gray-200/50 px-4 py-3 flex items-center justify-between">
            <div class="flex space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-400 border border-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-400 border border-green-500"></div>
            </div>
            <span class="text-xs font-semibold text-gray-600 tracking-wide uppercase">CRM Engine</span>
            <div class="w-10"></div> <!-- Spacer for centering -->
        </div>

        <!-- Content Area -->
        <div class="p-5 space-y-5">
            
            <!-- Scraped Data Section (Dummy Data) -->
            <div class="space-y-1">
                <p class="text-xs text-gray-500 font-medium uppercase">Current Case Context</p>
                <div class="bg-white/60 p-3 rounded-lg border border-gray-200 text-sm">
                    <div class="flex justify-between mb-1">
                        <span class="text-gray-500">ID:</span>
                        <span class="font-medium text-gray-800">CAS-8492-XYZ</span>
                    </div>
                    <div class="flex justify-between mb-1">
                        <span class="text-gray-500">User:</span>
                        <span class="font-medium text-gray-800">John Doe</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Issue:</span>
                        <span class="font-medium text-gray-800">Payment Failure</span>
                    </div>
                </div>
            </div>

            <!-- Decision Engine -->
            <div class="space-y-2">
                <label class="text-xs text-gray-500 font-medium uppercase">Select Reaction</label>
                <select class="w-full bg-white/80 border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                    <option>Standard Refund & Apology</option>
                    <option>Escalate to Tier 2</option>
                    <option>Request Additional Info</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 space-y-3">
                <button id="executeBtn" class="macos-btn-primary w-full py-2 rounded-lg font-medium text-sm transition transform active:scale-95 flex justify-center items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Execute Workflow
                </button>
                
                <button class="macos-btn w-full py-2 rounded-lg font-medium text-sm text-gray-700 transition transform active:scale-95 flex justify-center items-center">
                    <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export Session CSV
                </button>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="bg-gray-100/50 border-t border-gray-200/50 px-4 py-2 text-center">
            <span id="statusText" class="text-xs text-gray-500">Ready to automate.</span>
        </div>
    </div>

    <script>
        // Simple script to demonstrate interactivity for the mockup
        document.getElementById('executeBtn').addEventListener('click', function() {
            const btn = this;
            const status = document.getElementById('statusText');
            
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing D365...
            `;
            status.innerText = "Drafting email and filling forms...";
            status.classList.add('text-blue-500');

            setTimeout(() => {
                btn.classList.remove('macos-btn-primary');
                btn.style.background = 'linear-gradient(180deg, #34d399 0%, #10b981 100%)';
                btn.style.borderColor = '#059669';
                btn.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Resolved`;
                
                status.innerText = "Ticket successfully closed!";
                status.classList.remove('text-blue-500');
                status.classList.add('text-green-600', 'font-medium');
            }, 2000);
        });
    </script>
</body>
</html>
